<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taktil</title>
<meta name="description" content="Taktil. Coming soon.">
<style>
  :root { color-scheme: light dark; --ink: #1d1d1f; --quiet: #6e6e73; --page: #fbfbfd; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --quiet: #a1a1a6; --page: #000; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--page); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-align: center; padding: 16px;
  }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 72px); font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 12px 0 0; font-size: clamp(17px, 3.5vw, 22px); color: var(--quiet); }
</style>
</head>
<body>
  <main>
    <h1>Taktil</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
